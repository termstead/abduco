name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pty: script -qec ./testsuite.sh /dev/null
          - os: macos-latest
            pty: script -q /dev/null ./testsuite.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
        ./configure
        make

    - name: Test
      run: ${{ matrix.pty }}
