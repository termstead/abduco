name: Coverity Scan

env:
  PROJECT: abduco

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: ${{ vars.COVERITY_SCAN_EMAIL != '' }}
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Coverity Build Tool
      run: |
        wget -q https://scan.coverity.com/download/cxx/linux64 --post-data "token=$TOKEN&project=${GITHUB_REPOSITORY}" -O cov-analysis-linux64.tar.gz
        mkdir cov-analysis-linux64
        tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}

    - name: Configure
      run: ./configure

    - name: Build with cov-build
      run: |
        export PATH=$(pwd)/cov-analysis-linux64/bin:$PATH
        cov-build --dir cov-int make

    - name: Submit the result to Coverity Scan
      run: |
        tar czvf ${PROJECT}.tgz cov-int
        curl \
          --form project=${GITHUB_REPOSITORY} \
          --form token=$TOKEN \
          --form email=${EMAIL} \
          --form file=@${PROJECT}.tgz \
          --form version=trunk \
          --form description="`./${PROJECT} -v`" \
          "https://scan.coverity.com/builds?project=${GITHUB_REPOSITORY}"
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        EMAIL: ${{ vars.COVERITY_SCAN_EMAIL }}
